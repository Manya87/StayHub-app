spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: jdbc:h2:file:./data/stayhub_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

logging:
  level:
    com.stayhub: INFO
    org.springframework.security: WARN
